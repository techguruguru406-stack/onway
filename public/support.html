<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><h1>Support</h1>
<details><summary>How do I track a parcel?</summary><p>Enter your tracking ID on the Track page.</p></details><details><summary>Why is a fee requested on my shipment?</summary><p>Customs, duty or handling fees apply to some shipments; details show on the tracking page.</p></details><details><summary>How do I pay?</summary><p>Card, bank transfer with proof upload, or crypto.</p></details>
<h2>Contact us</h2><form id="f"><input name="name" placeholder="Name" required><br><input name="email" type="email" placeholder="Email" required><br><textarea name="message" placeholder="Message" required></textarea><br><button>Send</button></form><p id="m"></p></div><script src="app.js"></script>
<script>$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/contact',{method:'POST',body:Object.fromEntries(new FormData(e.target))});$('#m').textContent='Sent ✔'}catch(x){$('#m').textContent=x.message}}</script></body></html>
