<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get a Quote – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><h1>Get a Quote</h1><form id="f"><label>Origin</label><input name="origin" required><label>Destination</label><input name="destination" required>
<label>Weight (kg)</label><input name="weight" type="number" step="0.1" min="0.1" required><label>L × W × H (cm)</label><div class="row" style="margin:0"><input name="l" type="number"><input name="w" type="number"><input name="h" type="number"></div>
<label>Service</label><select name="service"><option>express</option><option>standard</option><option>international</option><option>freight</option><option>sameday</option></select>
<label>Currency</label><select name="currency"><option value="NGN">₦ NGN</option><option>USD</option><option>GBP</option><option>EUR</option></select><br><button>Get estimate</button></form><h2 id="r"></h2></div><script src="app.js"></script>
<script>$('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{const r=await api('/api/quote',{method:'POST',body:b});$('#r').textContent=r.price.toLocaleString()+' '+r.currency+' · '+r.days+' day(s)'}catch(x){$('#r').textContent=x.message}}</script></body></html>
