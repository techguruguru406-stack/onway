<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><h1>My shipments</h1><div class="tbl"><table id="s"></table></div><h2>Payment history</h2><div class="tbl"><table id="p"></table></div><h2>Saved addresses</h2><div id="a"></div><form id="af" class="grid"><input name="label" placeholder="Label" required><input name="address" placeholder="Address" required><input name="city" placeholder="City" required><button>Save</button></form><p><a class="btn" href="/ship.html">New shipment</a></p><button onclick="localStorage.clear();location='/'">Log out</button></div><script src="app.js"></script>
<script>(async()=>{try{const s=await api('/api/my/shipments'),p=await api('/api/my/payments');
$('#s').innerHTML='<tr><th>ID<th>Status'+s.map(x=>`<tr><td><a href="/track.html?id=${esc(x.id)}">${esc(x.id)}</a><td>${esc(x.status)}<td>${x.price?`<a href="/label.html?id=${esc(x.id)}">Label</a>`:''}`).join('');
$('#p').innerHTML='<tr><th>Shipment<th>Amount<th>Status<th>'+p.map(x=>`<tr><td>${esc(x.shipmentId)}<td>${esc(x.amount)} ${esc(x.currency)}<td>${esc(x.status)}<td>${x.status==='Approved'?`<a href="/api/receipts/${esc(x.id)}">Receipt</a>`:''}`).join('')}const ad=await api('/api/my/addresses');$('#a').innerHTML=ad.map(x=>`<p>${esc(x.label)}: ${esc(x.address)}, ${esc(x.city)}</p>`).join('');
$('#af').onsubmit=async e=>{e.preventDefault();await api('/api/my/addresses',{method:'POST',body:Object.fromEntries(new FormData(e.target))});location.reload()}}catch{location='/login.html'}})()</script></body></html>
