<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule a Pickup – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><h1>Schedule a Pickup</h1><form id="f"><label>Address</label><input name="address" required><label>Date</label><input name="date" type="date" required><label>Time window</label><select name="window"><option>9am–12pm</option><option>12pm–3pm</option><option>3pm–6pm</option></select><label>Package details</label><textarea name="details"></textarea><br><button>Request pickup</button></form><p id="m"></p></div><script src="app.js"></script>
<script>$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/pickups',{method:'POST',body:Object.fromEntries(new FormData(e.target))});$('#m').textContent='Pickup requested ✔'}catch(x){$('#m').textContent=x.message}}</script></body></html>
