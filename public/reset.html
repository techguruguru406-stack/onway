<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body><div class="wrap" style="max-width:420px"><h1>New password</h1><form id="f"><input name="password" type="password" minlength="8" placeholder="New password (8+)" required><br><br><button>Reset</button></form><p id="m"></p></div><script src="app.js"></script>
<script>$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/reset',{method:'POST',body:{token:new URLSearchParams(location.search).get('token'),password:e.target.password.value}});location='/login.html'}catch(x){$('#m').textContent=x.message}}</script></body></html>
