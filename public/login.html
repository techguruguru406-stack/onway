<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap" style="max-width:420px"><h1>Login / Sign up</h1><form id="f"><label>Name (sign up only)</label><input name="name"><label>Email</label><input name="email" type="email" required><label>Password (8+)</label><input name="password" type="password" required minlength="8"><br><button value="login">Login</button> <button value="signup" type="button" id="su" style="background:var(--p)">Sign up</button></form><p><a href="/forgot.html">Forgot password?</a></p><p id="m"></p></div><script src="app.js"></script>
<script>async function a(k){try{const r=await api('/api/auth/'+k,{method:'POST',body:Object.fromEntries(new FormData($('#f')))});localStorage.token=r.token;location=r.role==='admin'?'/admin.html':'/dashboard.html'}catch(e){$('#m').textContent=e.message}}
$('#f').onsubmit=e=>{e.preventDefault();a('login')};$('#su').onclick=()=>a('signup')</script></body></html>
