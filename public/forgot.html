<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body><div class="wrap" style="max-width:420px"><h1>Forgot password</h1><form id="f"><input name="email" type="email" placeholder="Email" required><br><br><button>Send reset link</button></form><p id="m"></p></div><script src="app.js"></script>
<script>$('#f').onsubmit=async e=>{e.preventDefault();await api('/api/auth/forgot',{method:'POST',body:Object.fromEntries(new FormData(e.target))});$('#m').textContent='If that email exists, a reset link has been sent.'}</script></body></html>
