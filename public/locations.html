<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locations – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><h1>Find a Location</h1><input id="q" placeholder="Search city or address"><div id="r" class="grid" style="margin-top:1rem"></div></div><script src="app.js"></script>
<script>const go=async()=>{const l=await api('/api/locations?q='+encodeURIComponent($('#q').value));$('#r').innerHTML=l.map(x=>`<div class="card"><b>${esc(x.name)}</b><br>${esc(x.address)}<br>${esc(x.hours)}<br><a href="https://www.openstreetmap.org/search?query=${encodeURIComponent(x.address)}" target="_blank" rel="noopener">View on map</a></div>`).join('')||'No results';};$('#q').oninput=go;go()</script></body></html>
