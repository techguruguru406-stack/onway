<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shipping Label – OnWay</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<div class="wrap"><div id="l" style="border:3px solid #4D148C;padding:1rem;max-width:420px"></div><p><button onclick="print()">Print label</button> <a class="btn" id="inv" style="background:var(--p)">Invoice</a></p></div><script src="app.js"></script>
<script>(async()=>{const id=new URLSearchParams(location.search).get('id');try{const s=await api('/api/my/shipments/'+encodeURIComponent(id));
$('#l').innerHTML=`<h2 style="margin:0;color:#4D148C">On<span style="color:#FF6200">Way</span> ➤</h2><p><b>TRACKING ID: ${esc(s.id)}</b></p><p><b>FROM</b><br>${esc(s.sender.name)}<br>${esc(s.sender.address)}, ${esc(s.sender.city)}</p><p><b>TO</b><br>${esc(s.receiver.name)}<br>${esc(s.receiver.address)}, ${esc(s.receiver.city)}</p><p>${esc(s.service)} · ${esc(s.pkg?.weight)} kg</p><p style="font:700 1.6rem monospace;letter-spacing:4px">*${esc(s.id)}*</p>`;
$('#inv').href='#';$('#inv').onclick=async e=>{e.preventDefault();const r=await fetch('/api/invoices/'+s.id,{headers:{Authorization:'Bearer '+localStorage.token}});open(URL.createObjectURL(await r.blob()))}}catch{location='/login.html'}})()</script></body></html>
